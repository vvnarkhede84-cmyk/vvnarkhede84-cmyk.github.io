name: Sync AQI Data

on:
  schedule:
    # Run every hour at the top of the hour (00:00 UTC, 01:00 UTC, etc)
    - cron: '0 * * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  fetch-aqi-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for git operations
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Fetch AQI data
        env:
          WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
        run: |
          python scripts/fetch_aqi.py
      
      - name: Check for changes
        id: check_changes
        run: |
          git diff --quiet data/aqi_snapshot.json || echo "changes=true" >> $GITHUB_OUTPUT
      
      - name: Commit and push changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/aqi_snapshot.json
          git commit -m "📊 Update AQI snapshot - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git push
      
      - name: No changes detected
        if: steps.check_changes.outputs.changes != 'true'
        run: |
          echo "✅ AQI data is up to date - no changes needed"
